# dsh-delete-turn bundle patch: inserts the plugin row into the profile roster.
#
# The node half serves the loopback-only /dsh-delete-turn/* routes; the browser
# half (exports "./client") mounts the assistant-reply action, the DOM-enhanced
# row actions, and the confirmation dialog.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier and resolves `<name>/package.json`, so a
# subpath entry would be cached as "not a client package" and the browser half
# would silently never load.
- insert:
    - id: dsh-delete-turn
      name: 'dsh-delete-turn'
